name: "Scene lifecycle iOS tests"

on:
  pull_request:
    paths:
      - "ios/**"
      - "scene_lifecycle/**"
      - ".github/workflows/scene-lifecycle-ios.yml"

concurrency:
  group: scene-lifecycle-ios-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Swift Package Manager (SPM)
        run: flutter config --enable-swift-package-manager

      - name: Build the app for the simulator
        working-directory: scene_lifecycle
        run: |
          flutter pub get
          flutter build ios --debug --simulator --no-codesign

      - name: Tool versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Run the iOS tests
        working-directory: scene_lifecycle/ios
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator: $DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO 2>&1 | tee "$RUNNER_TEMP/all-tests.log"

      - name: Run the host-app link test on its own
        if: always()
        continue-on-error: true
        working-directory: scene_lifecycle/ios
        run: |
          set -o pipefail
          (
            until grep -q "DIAG test after deliver" "$RUNNER_TEMP/isolated-test.log" 2>/dev/null; do sleep 0.5; done
            sleep 2
            sample "$(pgrep -x Runner | tail -1)" 5 -file "$RUNNER_TEMP/runner-sample.txt" || true
          ) &
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -only-testing:RunnerTests/RunnerTests/testUniversalLinkOutsideFronteggStillReachesTheAppRouter \
            2>&1 | tee "$RUNNER_TEMP/isolated-test.log"

      - name: Diagnostics summary
        if: always()
        run: |
          for log in "$RUNNER_TEMP/all-tests.log" "$RUNNER_TEMP/isolated-test.log"; do
            echo "===== $(basename "$log")"
            grep -E "DIAG|Test Case|error:|Failed to handle route|Timeout waiting for first frame" "$log" || true
          done
          echo "===== runner-sample.txt"
          head -c 80000 "$RUNNER_TEMP/runner-sample.txt" || true

      - name: Upload the Runner sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-sample
          path: ${{ runner.temp }}/runner-sample.txt
          if-no-files-found: ignore
